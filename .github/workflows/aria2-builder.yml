name: Aria2 Builder

on:
  workflow_dispatch:

env:
  SCRIPT_REPO: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        PLATFORMS: [amd64, arm64, armhf, i386]
        include:
        - PLATFORMS: amd64
          BUILDER_IMAGE: debian:latest
          BUILD_SCRIPT: aria2-gnu-linux-build-amd64.sh
        - PLATFORMS: arm64
          BUILDER_IMAGE: debian:latest
          BUILD_SCRIPT: aria2-gnu-linux-cross-build-arm64.sh
        - PLATFORMS: armhf
          BUILDER_IMAGE: debian:latest
          BUILD_SCRIPT: aria2-gnu-linux-cross-build-armhf.sh
        - PLATFORMS: i386
          BUILDER_IMAGE: debian:latest
          BUILD_SCRIPT: aria2-gnu-linux-cross-build-i386.sh

    steps:
    - name: Install QEMU
      run: docker run --rm --privileged multiarch/qemu-user-static --reset -p yes

    - name: Checkout
      uses: actions/checkout@v6

    - name: Build
      env:
        DOCKER_BUILDKIT: 1
        BUILDER_IMAGE: ${{ matrix.BUILDER_IMAGE }}
        BUILD_SCRIPT: ${{ matrix.BUILD_SCRIPT }}
      run: |
        docker build \
          --build-arg BUILDER_IMAGE \
          --build-arg BUILD_SCRIPT \
          --platform=local \
          -o ./output . \
          2>&1 | tee build.log

    - name: Output Error Log
      if: (!cancelled())
      run: grep -iE 'fatal|error|critical|failure' build.log

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: aria2-${{ matrix.PLATFORMS }}
        path: output/*

    - name: Functional Testing
      run: |
        ./output/aria2c https://raw.githubusercontent.com/P3TERX/aria2.conf/master/dht.dat
        ./output/aria2c https://raw.githubusercontent.com/P3TERX/aria2.conf/master/dht6.dat
        ARCH_TORRENT=$(curl -sSL "https://geo.mirror.pkgbuild.com/iso/latest/" | \
          grep -oE 'archlinux-[0-9]{4}\.[0-9]{2}\.[0-9]{2}-x86_64\.iso\.torrent' | head -1)
        [ -n "$ARCH_TORRENT" ] || { echo "Failed to resolve Arch Linux torrent filename"; exit 1; }
        ./output/aria2c \
          --seed-time=0 \
          --enable-dht6=true \
          --dht-file-path="$PWD/dht.dat" \
          --dht-file-path6="$PWD/dht6.dat" \
          --dht-entry-point='dht.transmissionbt.com:6881' \
          --dht-entry-point6='dht.transmissionbt.com:6881' \
          "https://geo.mirror.pkgbuild.com/iso/latest/${ARCH_TORRENT}"

    - name: RPC Version Testing
      if: matrix.PLATFORMS == 'amd64'
      run: |
        CLI_VER="$(./output/aria2c --version | head -1 | awk '{print $3}')"
        echo "CLI version: ${CLI_VER}"
        [ -n "${CLI_VER}" ] || { echo "Failed to parse CLI version"; exit 1; }

        RPC_SECRET="ci-test-$(date +%s)"
        ./output/aria2c \
          --enable-rpc \
          --rpc-listen-all=false \
          --rpc-listen-port=6800 \
          --rpc-secret="${RPC_SECRET}" \
          --daemon=true \
          --dir=/tmp

        for i in 1 2 3 4 5; do
          curl -fsS http://127.0.0.1:6800/jsonrpc \
            -H 'Content-Type: application/json' \
            -d "{\"jsonrpc\":\"2.0\",\"id\":\"ping\",\"method\":\"aria2.getVersion\",\"params\":[\"token:${RPC_SECRET}\"]}" \
            >/dev/null && break
          sleep 1
        done

        RESP=$(curl -fsS http://127.0.0.1:6800/jsonrpc \
          -H 'Content-Type: application/json' \
          -d "{\"jsonrpc\":\"2.0\",\"id\":\"v\",\"method\":\"aria2.getVersion\",\"params\":[\"token:${RPC_SECRET}\"]}")
        echo "RPC response: ${RESP}"
        RPC_VER=$(echo "${RESP}" | jq -r '.result.version')

        curl -fsS http://127.0.0.1:6800/jsonrpc \
          -H 'Content-Type: application/json' \
          -d "{\"jsonrpc\":\"2.0\",\"id\":\"s\",\"method\":\"aria2.shutdown\",\"params\":[\"token:${RPC_SECRET}\"]}" \
          >/dev/null || true

        if [ "${RPC_VER}" != "${CLI_VER}" ]; then
          echo "::error::RPC version (${RPC_VER}) does not match CLI version (${CLI_VER})"
          exit 1
        fi
        echo "ARIA2_VERSION=${CLI_VER}" >> $GITHUB_ENV

    - name: Generate release informations
      run: |
        TIME="$(curl https://api.github.com/repos/${SCRIPT_REPO}/actions/runs/${GITHUB_RUN_ID} | jq -r .created_at)"
        TAG="ci-$(date -d "${TIME}" -u +'%Y%m%d-%H%M%S-%Z')"
        VER="${ARIA2_VERSION:-$(./output/aria2c --version | head -1 | awk '{print $3}')}"
        echo "RELEASE=${VER}_${TIME}" >> $GITHUB_ENV
        cat <<EOF | sed -E 's/^  //' | tee Release.md
          Aria2 ${VER} build with openssl 3.5

          # Sources
          Aria2: [aria2/aria2@master](https://github.com/aria2/aria2/tree/master)
        EOF

        echo "TAG=${TAG}" >>$GITHUB_ENV
        echo "NAME=$(head --line=1 Release.md)" >>$GITHUB_ENV
        tail --line=+2 Release.md >Body.md
    
    - name: Create release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.TAG }}
        name: ${{ env.NAME }}
        body_path: Body.md
        make_latest: true
        files: |
          output/*.gz
